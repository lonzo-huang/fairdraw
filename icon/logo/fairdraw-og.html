<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>FairDraw OG Image · 1200×630</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden;background:#070b14}
:root{--gold:#f5b83d;--gold2:#ffd98a;--gold3:#fff1c9;--blue:#3b82f6;--violet:#7c5cff;--green:#34d399;--ink:#f2f4f8;--sub:#9aa4b8;--mut:#646f85;
  --sans:"Noto Sans CJK SC","Noto Sans SC","PingFang SC",sans-serif;--num:"Inter Display","Inter",sans-serif;--mono:"DejaVu Sans Mono",ui-monospace,monospace}
.og{position:relative;width:1200px;height:630px;overflow:hidden;font-family:var(--sans);color:var(--ink);
  background:
   radial-gradient(620px 420px at 18% 8%,rgba(124,92,255,.32),transparent 65%),
   radial-gradient(560px 460px at 88% 30%,rgba(245,184,61,.26),transparent 62%),
   radial-gradient(500px 300px at 60% 110%,rgba(59,130,246,.22),transparent 70%),
   linear-gradient(160deg,#0b1020,#070b14)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:40px 40px;
  -webkit-mask-image:radial-gradient(900px 600px at 30% 40%,#000,transparent 80%)}

/* left */
.left{position:absolute;left:72px;top:84px;width:620px}
.brand{display:flex;align-items:center;gap:14px}
.mark{width:52px;height:52px;border-radius:15px;background:linear-gradient(135deg,var(--gold2),var(--gold) 55%,#ff8a3d);display:grid;place-items:center;color:#2a1600;font-size:28px;font-weight:900;box-shadow:0 12px 30px -10px rgba(245,184,61,.7)}
.wm{font-family:var(--num);font-weight:800;font-size:38px;letter-spacing:-.02em}
.wm b{color:var(--gold)}
.dom{margin-left:10px;font-family:var(--mono);font-size:16px;color:var(--mut);padding:4px 10px;border:1px solid rgba(255,255,255,.12);border-radius:8px}
h1{margin-top:48px;font-size:64px;line-height:1.16;font-weight:900;letter-spacing:-.01em}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--gold3),var(--gold) 60%,#ff9d6b);-webkit-background-clip:text;background-clip:text;color:transparent}
.en{margin-top:14px;font-family:var(--num);font-size:24px;color:var(--sub);letter-spacing:.01em}
.pills{display:flex;gap:8px;margin-top:40px;width:640px}
.pill{display:flex;align-items:center;gap:8px;height:48px;padding:0 15px 0 9px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);font-size:18px;font-weight:700;white-space:nowrap}
.pill i{width:28px!important;height:28px!important}
.pill i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal}
.pill svg{width:17px;height:17px}

/* right ticket */
.ticket{position:absolute;right:64px;top:70px;width:410px;height:490px;border-radius:30px;padding:2px;transform:rotate(3deg);
  background:conic-gradient(from 210deg,rgba(255,217,138,.95),rgba(124,92,255,.75),rgba(59,130,246,.65),rgba(245,184,61,.95));
  box-shadow:0 50px 100px -30px rgba(0,0,0,.8),0 30px 80px -30px rgba(245,184,61,.5)}
.t-in{position:relative;height:100%;border-radius:28px;background:linear-gradient(180deg,#161c2d,#0e1320);overflow:hidden}
.t-top{padding:28px 30px 22px}
.host{display:flex;align-items:center;gap:12px}
.av{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#5aa0ff,#173a8a);display:grid;place-items:center;font-family:var(--num);font-weight:800;font-size:14px}
.host b{display:block;font-size:18px;font-family:var(--num)}
.host span{font-size:14px;color:var(--mut)}
.live{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:14px;color:var(--green);font-weight:700}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(52,211,153,.2)}
.win{margin-top:22px;font-size:26px;font-weight:900}
.amt{display:flex;align-items:baseline;gap:10px;margin-top:2px}
.amt b{font-family:var(--num);font-weight:800;font-size:96px;line-height:1;letter-spacing:-.04em;background:linear-gradient(180deg,var(--gold3),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.amt span{font-family:var(--num);font-size:26px;font-weight:700;color:var(--sub)}
.prog{margin-top:18px}
.prog .h{display:flex;justify-content:space-between;font-size:15px;color:var(--sub)}
.prog .h b{font-family:var(--num);color:var(--ink)}
.bar{height:10px;border-radius:10px;background:rgba(255,255,255,.08);margin-top:8px;overflow:hidden}
.bar i{display:block;width:86%;height:100%;border-radius:10px;background:linear-gradient(90deg,var(--blue),var(--violet))}
.perf{position:relative;border-top:2px dashed rgba(255,255,255,.14);margin:0 22px}
.perf::before,.perf::after{content:"";position:absolute;top:-14px;width:26px;height:26px;border-radius:50%;background:#0c1120}
.perf::before{left:-37px}.perf::after{right:-37px}
.t-bot{padding:20px 30px}
.vh{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--green)}
.vh svg{width:18px;height:18px}
.hash{margin-top:10px;font-family:var(--mono);font-size:13px;line-height:1.6;color:var(--sub);word-break:break-all}
.hash em{font-style:normal;color:var(--gold2)}
.ok{display:flex;align-items:center;gap:10px;margin-top:14px;padding:10px 14px;border-radius:14px;background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.35);font-size:15px;font-weight:700;color:var(--green)}
.ok svg{width:18px;height:18px}

/* floating chips */
.float{position:absolute;display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:16px;background:rgba(18,24,40,.9);border:1px solid rgba(255,255,255,.14);box-shadow:0 24px 50px -20px rgba(0,0,0,.8);font-size:16px;font-weight:700}
.float i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:800;color:#2a1600;background:linear-gradient(135deg,var(--gold2),var(--gold))}
.float span{display:block;font-size:12px;font-weight:500;color:var(--mut)}
.f1{right:300px;top:536px;transform:rotate(-3deg)}
.f2{right:46px;top:36px;transform:rotate(5deg);z-index:2}
</style>
</head>
